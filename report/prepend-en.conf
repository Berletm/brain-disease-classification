<?xml version="1.0" encoding="UTF-8"?>
<config>
  <sourcemap>
    <maps datatype="bibtex" map_overwrite="1">
      <map>
        <map_step map_field_source="entrykey" map_match="(.+)"/>
        <map_step map_entry_clone="EN-$1"/>
      </map>
    </maps>
  </sourcemap>
  <datamodel>
    <fields>
      <field fieldtype="field" datatype="literal">address</field>
      <field fieldtype="field" datatype="literal">location</field>
      <field fieldtype="field" datatype="literal">school</field>
      <field fieldtype="field" datatype="literal">institution</field>
      <field fieldtype="field" datatype="literal">inlanguage</field>
      <field fieldtype="field" datatype="literal">urldate</field>
      <field fieldtype="field" datatype="literal">medium</field>
      <field fieldtype="field" datatype="literal">articleno</field>
      <field fieldtype="field" datatype="literal">translator</field>
      <field fieldtype="field" datatype="literal">section</field>
      <field fieldtype="field" datatype="literal">eprint</field>
      <field fieldtype="field" datatype="literal">eprinttype</field>
      <field fieldtype="field" datatype="literal">nationality</field>
      <field fieldtype="field" datatype="literal">holder</field>
      <field fieldtype="field" datatype="literal">titleraw</field>
      <field fieldtype="field" datatype="literal">journal</field>
    </fields>
    <entryfields>
      <field>address</field>
      <field>location</field>
      <field>school</field>
      <field>institution</field>
      <field>inlanguage</field>
      <field>urldate</field>
      <field>medium</field>
      <field>articleno</field>
      <field>translator</field>
      <field>section</field>
      <field>eprint</field>
      <field>eprinttype</field>
      <field>nationality</field>
      <field>holder</field>
      <field>titleraw</field>
      <field>journal</field>
    </entryfields>
  </datamodel>
</config>
