[project]
name = "brain-disease-classification"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "numpy==2.5.2",
  "nibabel==5.4.2",
  "scikit-learn==1.9.1",
  "scikit-image==0.26.0",
  "matplotlib==3.11.1",
  "seaborn==0.13.2",
  "Pillow==12.3.0",
  "optuna==5.0.0",
  "tqdm==4.70.1",
  "hydra-core==1.4.0rc3",
  "mlflow==3.18.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
